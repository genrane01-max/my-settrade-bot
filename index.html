<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settrade Bot Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #161e2e;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #243048;
        }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 22px; font-weight: 700; color: #38bdf8; margin: 0 0 8px 0; }
        .header p { font-size: 13px; color: #64748b; margin: 0; }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 12px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .status-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #2e3d58;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
        }
        input:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }

        .btn-submit {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-submit:active { transform: scale(0.98); }
        .toast {
            display: none;
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⚡ Settrade Trading Bot</h1>
        <p>ระบบควบคุมคำสั่งจุดขายและเฝ้าระวังหุ้น</p>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span id="status-text">เชื่อมต่อ Firebase สำเร็จ</span>
        </div>
    </div>

    <form id="config-form">
        <div class="form-group">
            <label>📈 ชื่อหุ้นที่ต้องการโฟกัส (TARGET_SYMBOL)</label>
            <input type="text" id="symbol" placeholder="เช่น TTB, DELTA" required style="text-transform: uppercase;">
        </div>

        <div class="form-group">
            <label>📉 Bid หายกะทันหัน (% Threshold)</label>
            <input type="number" step="0.1" id="bid_drop" placeholder="50.0" required>
        </div>

        <div class="form-group">
            <label>🛑 ระยะ Trailing Stop Offset (บาท)</label>
            <input type="number" step="0.01" id="trailing_offset" placeholder="0.04" required>
        </div>

        <button type="submit" class="btn-submit">💾 บันทึกการตั้งค่า</button>
    </form>

    <div id="toast" class="toast">✅ บันทึกข้อมูลเรียบร้อยแล้ว!</div>
</div>

<script>
    // Config สำหรับ Firebase
    const firebaseConfig = {
        databaseURL: "https://ragnarok-498b6-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const form = document.getElementById('config-form');
    const toast = document.getElementById('toast');

    // ดึงค่า Real-time จาก Firebase มาแสดงในช่อง Form
    database.ref('config').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            document.getElementById('symbol').value = data.target_symbol || 'TTB';
            document.getElementById('bid_drop').value = data.bid_drop_pct || 50.0;
            document.getElementById('trailing_offset').value = data.trailing_offset || 0.04;
        }
    });

    // บันทึกค่าใหม่กลับไปที่ Firebase
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const symbol = document.getElementById('symbol').value.toUpperCase().trim();
        const bidDrop = parseFloat(document.getElementById('bid_drop').value);
        const trailingOffset = parseFloat(document.getElementById('trailing_offset').value);

        database.ref('config').set({
            target_symbol: symbol,
            bid_drop_pct: bidDrop,
            trailing_offset: trailingOffset
        }).then(() => {
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        });
    });
</script>

</body>
</html>
